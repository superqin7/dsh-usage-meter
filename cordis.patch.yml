- insert:
    - id: usage-meter
      name: dsh-usage-meter
      config:
        route: /plugin/usage-meter/summary
        currency: CNY
        # Cache reads are not always quoted by a provider. A model without an
        # explicit `cacheRead` is priced at this fraction of its input rate.
        cacheReadRatio: 0.1
        # Rates are currency units per one million tokens, written as
        # { input, output }. The entry below is an EXAMPLE: replace it with the
        # rates your own provider charges. Any model you leave out falls back to
        # `defaultPrice`, so the meter always reports a cost.
        prices:
          deepseek-flash: { input: 2, output: 8 }
        # Fallback card for every model absent from `prices`. Set it to your
        # provider's rates, or remove both `prices` and this key to show tokens
        # only and report "—" for cost.
        defaultPrice: { input: 2, output: 8 }
