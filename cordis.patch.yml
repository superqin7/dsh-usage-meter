- insert:
    - id: usage-meter
      name: dsh-usage-meter
      config:
        route: /plugin/usage-meter/summary
        currency: CNY
        # Cache reads are not quoted in the source price table, which lists
        # input/output only. A model without an explicit `cacheRead` is priced
        # at this fraction of its input rate.
        cacheReadRatio: 0.1
        # Rates are currency units per one million tokens, taken from the
        # account's model price list (quoted there as "input / output").
        prices:
          deepseek-flash: { input: 2, output: 8 }
          'MiniMax-H3-Image-PE': { input: 1.8, output: 10.8 }
          'nvidia/Qwen3.6-35B-A3B-NVFP4': { input: 1.8, output: 10.8 }
          'Qwen/Qwen3.8-27B-FP8': { input: 3, output: 12 }
          qwen3.8-27b: { input: 3, output: 12 }
          qwen3.8-flash: { input: 0.8, output: 2.7 }
          qwen3.8-max: { input: 12, output: 36 }
          MiniMax-M3: { input: 2.1, output: 8.4 }
          glm-5.3-flash: { input: 0.8, output: 2.8 }
          glm-5.3: { input: 8, output: 28 }
          kimi-k3: { input: 20, output: 100 }
        # Any model missing from the table falls back to this card.
        defaultPrice: { input: 2, output: 8 }
